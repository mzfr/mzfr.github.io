<script>
document.addEventListener('click', function(e) {
    if (e.target.classList.contains('tooltip')) {
        const wasShowing = e.target.getAttribute('data-show') === 'true';
        // Hide all tooltips
        document.querySelectorAll('.tooltip[data-show="true"]').forEach(el => {
            el.setAttribute('data-show', 'false');
        });
        // Toggle clicked tooltip
        if (!wasShowing) {
            e.target.setAttribute('data-show', 'true');
        }
    } else {
        // Hide all tooltips when clicking outside
        document.querySelectorAll('.tooltip[data-show="true"]').forEach(el => {
            el.setAttribute('data-show', 'false');
        });
    }
});
</script>
