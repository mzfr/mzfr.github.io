baseURL: "https://blog.mzfr.me"
title: "~/mzfr"
theme: ["PaperMod"]
pagination:
  pageSize: 5


minify:
  disableXML: true
  minifyOutput: true

taxonomies:
  category: categories
  tag: tags

menu:
    main:
      - name: Home
        url: /
        weight: 1
      - name: About
        url: /about/
        weight: 2
      - name: Resume
        url: https://github.com/mzfr/resume/blob/master/Mehtab_Zafar_resume.pdf
        weight: 3
      - name: Notes
        url: https://wiki.mzfr.me
        weight: 4
      - name: Writeups
        url: /ctf/
        weight: 5

markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: gruvbox
  goldmark:
    renderer:
      unsafe: true  
params:
  env: production
  ShowReadingTime: true
  ShowPostNavLinks: true
  disableThemeToggle: true
  assets:
    disableHLJS: true


  homeInfoParams:
    enabled: True
    Title: "$ whoami"
    Content: "Hi! I'm Mehtab, an engineer at heart with a focus on security"

  socialIcons:
    - name: github
      url: "https://github.com/mzfr"
    - name: email
      url: "mailto:hello@mzfr.me"
    - name: rss
      url: "https://blog.mzfr.me/index.xml"
