baseURL: "https://blog.mzfr.me"
title: "~/mzfr"
theme: ["PaperMod"]

mainSections: ["posts"]

minify:
  disableXML: true
  minifyOutput: true

# Make existing local images available to Hugo's build-time image processing.
module:
  mounts:
    - source: assets
      target: assets
    - source: static/images
      target: assets/images

taxonomies:
  category: categories
  tag: tags

menu:
    main:
      - name: Posts
        url: /posts/
        weight: 1
      - name: Writeups
        url: /ctf/
        weight: 2
      # Books are kept as a draft for later publication.
      # - name: Books
      #   url: /books/
      #   weight: 3
      - name: Notes
        url: https://wiki.mzfr.me
        weight: 4
      - name: Resume
        url: https://github.com/mzfr/resume/blob/master/Mehtab_Zafar_resume.pdf
        weight: 5

markup:
  tableOfContents:
    startLevel: 1
    endLevel: 6
  highlight:
    codeFences: true
    guessSyntax: false
    noClasses: false
    lineNos: false
    style: gruvbox
  goldmark:
    renderer:
      unsafe: true
params:
  env: production
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  assets:
    theme_color: "#192b29"

  socialIcons:
    - name: github
      url: "https://github.com/mzfr"
    - name: googlescholar
      url: "https://scholar.google.com/citations?hl=en&user=jjZ7jRQAAAAJ"
    - name: email
      url: "mailto:hello@mzfr.me"
    - name: rss
      url: "https://blog.mzfr.me/index.xml"
